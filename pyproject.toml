[project]
name = "flight-map"
version = "0.1.0"
description = "可追溯、按 AIRAC 版本化的航空资料研究平台"
requires-python = ">=3.12"
dependencies = [
  "flightmap-api",
  "flightmap-ingestion",
  "flightmap-schema",
  "flightmap-storage",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.uv.sources]
flightmap-api = { workspace = true }
flightmap-ingestion = { workspace = true }
flightmap-schema = { workspace = true }
flightmap-storage = { workspace = true }

[tool.uv.workspace]
members = ["packages/schema", "packages/storage", "services/api", "services/ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
cache_dir = ".cache/pytest"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
