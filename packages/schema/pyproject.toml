[project]
name = "flightmap-schema"
version = "0.1.0"
description = "Flight Map 共享数据模型"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightmap_schema"]
