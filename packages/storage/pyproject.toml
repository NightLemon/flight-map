[project]
name = "flightmap-storage"
version = "0.2.0"
description = "Local immutable assets and transactional research releases"
requires-python = ">=3.12"
dependencies = ["flightmap-schema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightmap_storage"]

[tool.uv.sources]
flightmap-schema = { workspace = true }
