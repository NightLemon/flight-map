name: flight-map

services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: flightmap
      POSTGRES_USER: flightmap
      POSTGRES_PASSWORD: flightmap
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightmap -d flightmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: flightmap
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgis-data:
  minio-data:
