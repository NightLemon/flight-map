[project]
name = "flightmap-api"
version = "0.1.0"
description = "Flight Map 只读 API"
requires-python = ">=3.12"
dependencies = [
  "flightmap-schema",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
flightmap-api = "flightmap_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightmap_api"]

[tool.uv.sources]
flightmap-schema = { workspace = true }
