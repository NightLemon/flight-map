[project]
name = "flightmap-ingestion"
version = "0.1.0"
description = "Flight Map 数据发现、采集、校验与发布管线"
requires-python = ">=3.12"
dependencies = [
  "flightmap-schema",
  "flightmap-storage",
  "geographiclib>=2,<3",
  "httpx>=0.28,<1",
  "typer>=0.16,<1",
]

[project.scripts]
flightmap-ingest = "flightmap_ingestion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightmap_ingestion"]

[tool.uv.sources]
flightmap-schema = { workspace = true }
flightmap-storage = { workspace = true }
